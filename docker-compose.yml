# Production stack. Traefik (external "web" network) terminates TLS and
# routes ${DOMAIN_NAME} to the drupal container. For local development add
# docker-compose.local.yml, see scripts/dev.sh.

networks:
  web:
    external: true
  internal:
    external: false

services:
  stjernekig_db:
    image: mariadb:11
    container_name: stjernekig_db
    command: --transaction-isolation=READ-COMMITTED --max-allowed-packet=64M
    restart: always
    env_file:
      - .env
    environment:
      MARIADB_DATABASE: "${DB_NAME}"
      MARIADB_USER: "${DB_USER}"
      MARIADB_PASSWORD: "${DB_PASS}"
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - ./data/mysql:/var/lib/mysql
    labels:
      - "traefik.enable=false"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 30s

  drupal:
    container_name: stjernekig_drupal
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: stjernekig:latest
    restart: always
    env_file:
      - .env
    working_dir: /opt/drupal
    volumes:
      - ./web/sites/default/files:/opt/drupal/web/sites/default/files
      - ./data/private:/opt/drupal/private
      - ./backups:/opt/drupal/backups
      - ./config:/opt/drupal/config
      - ./settings.php:/opt/drupal/web/sites/default/settings.php:ro
      - ./web/modules/custom:/opt/drupal/web/modules/custom:ro
      - ./web/themes/custom:/opt/drupal/web/themes/custom:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stjernekig.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.stjernekig.entrypoints=websecure"
      - "traefik.http.routers.stjernekig.tls.certresolver=lets-encrypt"
      - "traefik.http.services.stjernekig.loadbalancer.server.port=80"
      # Video entries embed YouTube and Vimeo players; everything else is first party.
      - "traefik.http.middlewares.stjernekig-headers.headers.contentSecurityPolicy=default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; font-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://player.vimeo.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
      - "traefik.http.middlewares.stjernekig-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.stjernekig-headers.headers.customResponseHeaders.X-Drupal-Cache="
      - "traefik.http.middlewares.stjernekig-headers.headers.customResponseHeaders.X-Drupal-Dynamic-Cache="
      - "traefik.http.middlewares.stjernekig-headers.headers.customResponseHeaders.X-Generator="
      - "traefik.http.routers.stjernekig.middlewares=stjernekig-headers"
    networks:
      - internal
      - web
    depends_on:
      stjernekig_db:
        condition: service_healthy

  # Runs Drupal cron hourly: queues the newest day(s) and drains the import queue.
  cron:
    container_name: stjernekig_cron
    image: stjernekig:latest
    restart: always
    env_file:
      - .env
    user: www-data
    working_dir: /opt/drupal
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 60
        while true; do
          vendor/bin/drush cron --quiet || echo "cron failed at $(date -u +%FT%TZ)"
          sleep 3600
        done
    volumes:
      - ./web/sites/default/files:/opt/drupal/web/sites/default/files
      - ./data/private:/opt/drupal/private
      - ./config:/opt/drupal/config
      - ./settings.php:/opt/drupal/web/sites/default/settings.php:ro
      - ./web/modules/custom:/opt/drupal/web/modules/custom:ro
      - ./web/themes/custom:/opt/drupal/web/themes/custom:ro
    labels:
      - "traefik.enable=false"
    networks:
      - internal
    depends_on:
      drupal:
        condition: service_started
