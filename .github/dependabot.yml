version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      drupal-core:
        patterns:
          - "drupal/core*"
      dev-tools:
        dependency-type: development

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Database majors are a manual migration, never a Dependabot merge.
      - dependency-name: mariadb
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
